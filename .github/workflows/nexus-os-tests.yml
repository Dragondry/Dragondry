name: NEXUS OS tests
on:
  push:
    paths:
      - "nexus-os/**"
      - ".github/workflows/nexus-os-tests.yml"
  pull_request:
    paths:
      - "nexus-os/**"
      - ".github/workflows/nexus-os-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
